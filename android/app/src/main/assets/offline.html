<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vicinity</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #0e1015; color: #e6e8ee;
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center; padding: 24px; box-sizing: border-box;
  }
  .logo {
    width: 72px; height: 72px; border-radius: 22px; margin: 0 auto 20px;
    background: #2bc6a4; display: flex; align-items: center; justify-content: center;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: #9aa1ae; }
  button {
    border: 0; border-radius: 12px; padding: 12px 28px;
    background: #2bc6a4; color: #07221d; font: inherit; font-weight: 600;
  }
  button:active { transform: scale(0.97); }
  .spin { display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px;
    border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <main>
    <div class="logo">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#07221d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l6 11 6-11" /></svg>
    </div>
    <h1>Нет связи с сервером</h1>
    <p>Проверьте интернет — приложение переподключится само.</p>
    <button id="retry" type="button">Повторить</button>
  </main>
  <script>
    var btn = document.getElementById('retry');
    function retry() {
      btn.innerHTML = '<span class="spin"></span>Подключаемся…';
      if (window.VicinityAndroid) window.VicinityAndroid.retry();
    }
    btn.addEventListener('click', retry);
    window.addEventListener('online', retry);
    setInterval(function () { if (navigator.onLine) retry(); }, 15000);
  </script>
</body>
</html>

name: E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libjsoncpp-dev uuid-dev libsqlite3-dev libssl-dev zlib1g-dev libcurl4-openssl-dev

      # Тот же ключ и те же опции, что в backend-ci.yml и deploy/Dockerfile — кэш общий
      - name: Cache Drogon
        id: drogon-cache
        uses: actions/cache@v4
        with:
          path: /tmp/drogon-install
          key: drogon-v1.9.13-ubuntu-24.04

      - name: Build Drogon
        if: steps.drogon-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch v1.9.13 --depth 1 --recursive https://github.com/drogonframework/drogon.git /tmp/drogon
          cmake -S /tmp/drogon -B /tmp/drogon/build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_ORM=ON -DBUILD_SQLITE=ON -DBUILD_MYSQL=OFF -DBUILD_POSTGRESQL=OFF -DBUILD_REDIS=OFF \
            -DBUILD_CTL=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX=/tmp/drogon-install
          cmake --build /tmp/drogon/build --parallel 4
          cmake --install /tmp/drogon/build

      - name: Build backend
        run: |
          cmake -S backend -B build/backend -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/tmp/drogon-install
          cmake --build build/backend --parallel 4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: web
        env:
          LD_LIBRARY_PATH: /tmp/drogon-install/lib
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

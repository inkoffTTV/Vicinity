name: Docker

# Образы из deploy/ (сервер и веб) собираются без публикации и проверяются в docker compose;
# конфиги деплоя (compose, nginx, Caddyfile, скрипты) — отдельной быстрой задачей.
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'web/**'
      - 'deploy/**'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'web/**'
      - 'deploy/**'
      - '.dockerignore'
      - '.github/workflows/docker.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: Deploy configs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Все сценарии из env.example: сайт по IP, HTTPS через Caddy (профиль "https"), за прокси хоста
      - name: docker compose config
        working-directory: deploy
        run: |
          sed -e 's/^PUBLIC_IP=$/PUBLIC_IP=203.0.113.10/' -e 's/^VICINITY_TURN_SECRET=$/VICINITY_TURN_SECRET=ci-secret/' \
            env.example > .env
          docker compose config -q
          WEB_BIND=127.0.0.1 WEB_PORT=8081 docker compose config -q
          COMPOSE_PROFILES=https DOMAIN=chat.example.com WEB_BIND=127.0.0.1 WEB_PORT=8081 \
            docker compose config --services | grep -qx caddy

      - name: nginx -t
        run: |
          docker run --rm -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t
          docker run --rm -v "$PWD/deploy/host-proxy/nginx-vicinity.conf:/etc/nginx/conf.d/vicinity.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: caddy validate
        run: |
          docker run --rm -e DOMAIN=chat.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm -v "$PWD/deploy/host-proxy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: shellcheck
        run: docker run --rm -v "$PWD/deploy:/mnt:ro" koalaman/shellcheck:v0.10.0 -s sh /mnt/backup.sh /mnt/update.sh

  images:
    name: Images
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Теги — те, под которыми образы собирает docker compose в deploy/ (проект "deploy").
      # Слои, в том числе сборка Drogon, кэшируются в GitHub Actions.
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: deploy-vicinity:latest
          cache-from: type=gha,scope=vicinity
          cache-to: type=gha,scope=vicinity,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: false
          load: true
          tags: deploy-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Сервер и веб из этих образов, как на VPS за прокси хоста; ждём healthy по healthcheck
      - name: Start with docker compose
        working-directory: deploy
        run: |
          sed -e 's/^PUBLIC_IP=$/PUBLIC_IP=203.0.113.10/' -e 's/^VICINITY_TURN_SECRET=$/VICINITY_TURN_SECRET=ci-secret/' \
            -e 's/^WEB_BIND=.*/WEB_BIND=127.0.0.1/' -e 's/^WEB_PORT=.*/WEB_PORT=8081/' \
            -e 's/^BACKEND_BIND=.*/BACKEND_BIND=127.0.0.1/' env.example > .env
          docker compose up -d --no-build --wait --wait-timeout 180 vicinity web

      - name: Smoke test
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/api/v1/auth/me)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/auth/me)" = 401
          # TURN из .env доходит до сервера: учётки для coturn на PUBLIC_IP
          token=$(curl -fsS -X POST http://127.0.0.1:8081/api/v1/auth/register -H 'Content-Type: application/json' \
            -d '{"username":"ci-smoke","password":"password123","display_name":"CI"}' | jq -r .token)
          curl -fsS http://127.0.0.1:8081/api/v1/rtc/ice -H "Authorization: Bearer $token" \
            | jq -e '.ice_servers[1].urls[0] == "turn:203.0.113.10:3478?transport=udp" and (.ice_servers[1].credential | length > 0)'

      - name: Container logs
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color vicinity web

name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-backend:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libjsoncpp-dev \
            uuid-dev \
            libsqlite3-dev \
            libssl-dev \
            zlib1g-dev

      - name: Build and install Drogon
        run: |
          git clone --branch v1.9.13 --depth 1 --recursive https://github.com/drogonframework/drogon.git /tmp/drogon

          cmake -S /tmp/drogon -B /tmp/drogon/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_ORM=ON \
            -DBUILD_SQLITE=ON \
            -DBUILD_MYSQL=OFF \
            -DBUILD_POSTGRESQL=OFF \
            -DBUILD_REDIS=OFF \
            -DBUILD_CTL=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTING=OFF

          cmake --build /tmp/drogon/build --parallel 2
          sudo cmake --install /tmp/drogon/build
          sudo ldconfig

      - name: Configure backend
        run: cmake -S backend -B build-ci/backend -DCMAKE_BUILD_TYPE=Release

      - name: Build backend
        run: cmake --build build-ci/backend --parallel 2

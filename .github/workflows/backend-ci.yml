name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-backend:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libdrogon-dev \
            libjsoncpp-dev \
            uuid-dev \
            libssl-dev

      - name: Configure backend
        run: cmake -S backend -B build-ci/backend -DCMAKE_BUILD_TYPE=Release

      - name: Build backend
        run: cmake --build build-ci/backend --parallel
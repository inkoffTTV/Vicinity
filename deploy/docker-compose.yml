# Vicinity на VPS: сервер (vicinity), веб-клиент (web, nginx), TURN для звонков (coturn)
# и необязательный Caddy с автоматическим HTTPS (профиль "https").
#
#   cd deploy
#   cp env.example .env      # заполнить PUBLIC_IP, VICINITY_TURN_SECRET и выбрать сценарий портов
#   docker compose up -d --build
#
# Пошагово — DEPLOY-VPS.md. Обновление — sh update.sh, резервная копия — sh backup.sh.
# Данные (vicinity.db, uploads) лежат в томе vicinity-data и переживают пересборки.

x-logging: &logging
  # Логи контейнеров не съедают диск маленького VPS: до 3 файлов по 10 МБ на сервис
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  vicinity:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: vicinity-server
    environment:
      # Поверх custom_config из config.docker.json (пустое значение оставляет значение из файла)
      VICINITY_TURN_SECRET: ${VICINITY_TURN_SECRET:?впиши VICINITY_TURN_SECRET в deploy/.env (openssl rand -hex 32)}
      VICINITY_TURN_URLS: ${VICINITY_TURN_URLS:-turn:${PUBLIC_IP}:3478?transport=udp,turn:${PUBLIC_IP}:3478?transport=tcp}
      VICINITY_STUN_URLS: ${VICINITY_STUN_URLS:-}
      VICINITY_TRUSTED_PROXIES: ${VICINITY_TRUSTED_PROXIES:-}
    ports:
      # Прямой доступ для десктоп-клиентов: http://IP_VPS:8080. Закрыть снаружи — BACKEND_BIND=127.0.0.1
      # (правила ufw на опубликованные порты Docker не действуют)
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-8080}:8080"
    volumes:
      - vicinity-data:/data
    healthcheck:
      # 401 от /auth/me без токена — сервер жив и отвечает
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/auth/me | grep -qx 401"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  # Веб-версия: отдаёт сайт и проксирует /api, /ws, /uploads на сервис vicinity.
  # Адрес публикации — WEB_BIND:WEB_PORT (по умолчанию 0.0.0.0:80, т. е. http://IP_VPS).
  # За Caddy из профиля "https" или nginx/Caddy хоста — 127.0.0.1:8081 (см. env.example).
  # WEB_BIND — только IPv4-адрес: nginx доверяет X-Forwarded-For с адреса шлюза Docker (так приходит
  # прокси хоста), а IPv6-клиентов docker-proxy привёл бы с того же адреса (deploy/nginx.conf).
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: vicinity-web
    depends_on:
      - vicinity
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  # TURN/STUN для звонков: UDP/TCP 3478 и relay-порты UDP 49160-49200 (открыть в файерволе).
  # Сеть хоста — coturn нужен реальный IP и диапазон UDP-портов без NAT Docker.
  # Публичный IP и секрет — из .env, turnserver.conf править не нужно.
  coturn:
    image: coturn/coturn:4.7.0
    container_name: vicinity-coturn
    network_mode: host
    environment:
      PUBLIC_IP: ${PUBLIC_IP:?впиши PUBLIC_IP (публичный IP VPS) в deploy/.env}
      VICINITY_TURN_SECRET: ${VICINITY_TURN_SECRET:?впиши VICINITY_TURN_SECRET в deploy/.env (openssl rand -hex 32)}
    # Секрет не попадает в командную строку turnserver (её видит любой пользователь хоста в ps):
    # при старте он дописывается в копию turnserver.conf внутри контейнера (права 600) и убирается
    # из окружения процесса. Свой скрипт вместо docker-entrypoint.sh образа: тот вычисляет аргументы через eval.
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        conf=$$(mktemp)
        cat /etc/coturn/turnserver.conf > "$$conf"
        printf 'static-auth-secret=%s\n' "$$VICINITY_TURN_SECRET" >> "$$conf"
        unset VICINITY_TURN_SECRET
        exec turnserver -c "$$conf" --log-file=stdout --external-ip="$$PUBLIC_IP"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    restart: unless-stopped
    logging: *logging

  # HTTPS с автоматическим сертификатом Let's Encrypt для DOMAIN — только если порты 80/443 свободны.
  # Включается профилем: COMPOSE_PROFILES=https в .env (или docker compose --profile https up -d).
  # Сеть хоста: Caddy сам слушает 80/443 (TCP и UDP для HTTP/3) на всех адресах VPS, IPv4 и IPv6, и видит
  # настоящий адрес клиента — без docker-proxy, который привёл бы всех IPv6-клиентов с одного адреса шлюза
  # (общий лимит попыток входа на всех). На сайт ходит по 127.0.0.1:WEB_PORT.
  caddy:
    image: caddy:2.10.2-alpine
    container_name: vicinity-caddy
    profiles: ["https"]
    network_mode: host
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:-}
      WEB_PORT: ${WEB_PORT:-80}
    # Без DOMAIN Caddyfile читался бы иначе, а на WEB_PORT=80 уже сидит веб-контейнер —
    # останавливаемся с понятной ошибкой в логах
    command:
      - "sh"
      - "-c"
      - 'test -n "$$DOMAIN" || { echo "DOMAIN не задан в deploy/.env" >&2; exit 1; }; test "$$WEB_PORT" != 80 && test "$$WEB_PORT" != 443 || { echo "Для HTTPS через Caddy в deploy/.env нужны WEB_BIND=127.0.0.1 и WEB_PORT=8081 (порты 80/443 занимает Caddy)" >&2; exit 1; }; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    logging: *logging

volumes:
  vicinity-data:
  # Сертификаты и ключ аккаунта Let's Encrypt — не выпускаются заново при каждом пересоздании
  caddy-data:
  caddy-config:

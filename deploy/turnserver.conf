# coturn — TURN/STUN-сервер для звонков Vicinity (сервис coturn в docker-compose.yml).
# Править этот файл не нужно: публичный IP и секрет compose передаёт флагами из deploy/.env —
#   --external-ip=$PUBLIC_IP --static-auth-secret=$VICINITY_TURN_SECRET
# Тот же секрет получает сервер Vicinity и выдаёт клиентам временные учётки (GET /api/v1/rtc/ice,
# срок — 24 часа); сам секрет клиентам не передаётся.
# Не вписывай static-auth-secret сюда: coturn принимает все заданные секреты сразу.

listening-port=3478
fingerprint
realm=vicinity

# Временные учётки по общему секрету (REST API coturn):
# логин "<unix-время истечения>:<id пользователя>", пароль = base64(HMAC-SHA1(секрет, логин))
use-auth-secret

# TLS (turns:, порт 5349) выключен: для него нужен сертификат (cert=/pkey=) и открытый порт 5349.
# Браузеры и десктоп ходят на turn: по UDP и TCP 3478.
no-tls
no-dtls

# Диапазон relay-портов (открой в файерволе и панели хостера: UDP 49160-49200)
min-port=49160
max-port=49200

# Безопасность
no-cli
no-multicast-peers
# Не релеить на приватные/loopback адреса (иначе через TURN можно достучаться до сервисов VPS)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# coturn — TURN/STUN-сервер для звонков Vicinity (запускается на том же VPS).
# Перед запуском:
#   1) впиши публичный IP VPS в external-ip=
#   2) замени static-auth-secret на длинную случайную строку (например: openssl rand -hex 32)
#   3) тот же секрет и адреса TURN пропиши в config.json сервера Vicinity:
#      "custom_config": {"rtc": {"turn": ["turn:IP_VPS:3478?transport=udp",
#                                         "turn:IP_VPS:3478?transport=tcp"],
#                                "turn_secret": "<тот же секрет>"}}
#      Сервер выдаёт клиентам временные учётки (GET /api/v1/rtc/ice, срок — 24 часа),
#      сам секрет клиентам не передаётся.

listening-port=3478
# TLS (turns:, порт 5349) заработает только с сертификатом: cert=/путь/fullchain.pem, pkey=/путь/privkey.pem
tls-listening-port=5349
fingerprint
realm=vicinity

# Временные учётки по общему секрету (REST API coturn):
# логин "<unix-время истечения>:<id пользователя>", пароль = base64(HMAC-SHA1(секрет, логин))
use-auth-secret
static-auth-secret=REPLACE_WITH_LONG_RANDOM_SECRET

# Публичный IP VPS (обязательно для работы за NAT контейнера). Впиши свой:
# external-ip=YOUR_VPS_PUBLIC_IP

# Диапазон relay-портов (открой их в файерволе/панели: UDP 49160-49200)
min-port=49160
max-port=49200

# Безопасность
no-cli
no-tlsv1
no-tlsv1_1
no-multicast-peers
# Не релеить на приватные/loopback адреса
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

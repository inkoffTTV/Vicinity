# Веб-клиент Vicinity: отдаёт собранный фронтенд и проксирует API/WS/загрузки на бэкенд.

# Кэширование: хэшированные ассеты Vite — навсегда, приложение — с проверкой при каждой загрузке,
# у проксируемого бэкенда — его собственные заголовки (пустое значение add_header не добавляет).
map $uri $vicinity_cache_control {
    ~^/assets/          "public, max-age=31536000, immutable";
    ~^/(api|uploads)/   "";
    /ws                 "";
    default             "no-cache";
}

# Произвольные файлы-вложения скачиваются, а не открываются в браузере (docs/API.md §2)
map $uri $vicinity_disposition {
    ~^/uploads/files/   "attachment";
    default             "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Аватары/вложения до 15 МБ (+ запас на multipart)
    client_max_body_size 20m;

    # Адрес бэкенда узнаём у DNS Docker при запросах (кэш 10 с), а не один раз при старте:
    # после «docker compose up -d --build vicinity» у контейнера новый IP, и nginx отдавал бы 502.
    # С переменной в proxy_pass URI запроса передаётся бэкенду как есть.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://vicinity:8080;

    # Внешний reverse-proxy с TLS (Caddy/Nginx на хосте, см. DEPLOY-VPS.md) приходит в контейнер
    # с адреса шлюза сети Docker — только ему доверяем X-Forwarded-For. Иначе бэкенд видит один IP
    # на всех и общий лимит попыток входа срабатывает для всех пользователей сразу.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Заголовки безопасности — для всех ответов (ни один location ниже не задаёт своих add_header,
    # иначе эти бы не унаследовались). Скрипты и стили только свои; картинки/медиа ещё из blob:
    # (превью вложений) и data:; WebSocket к своему же хосту; микрофон/камера/экран — для звонков.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src 'self' blob: data:; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(self), display-capture=(self), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control $vicinity_cache_control;
    add_header Content-Disposition $vicinity_disposition;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass $backend;
        expires 7d;
    }

    location = /ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # В URL лежит токен сессии (?token=) — не пишем его в логи
        access_log off;
    }

    # Несуществующий хэшированный ассет — честный 404, а не index.html под видом скрипта
    location /assets/ {
        try_files $uri =404;
    }

    # SPA: всё остальное — index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Веб-клиент Vicinity: отдаёт собранный фронтенд и проксирует API/WS/загрузки на бэкенд.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Аватары/вложения до 15 МБ (+ запас на multipart)
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://vicinity:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://vicinity:8080;
        expires 7d;
    }

    location = /ws {
        proxy_pass http://vicinity:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # В URL лежит токен сессии (?token=) — не пишем его в логи
        access_log off;
    }

    # Хэшированные ассеты Vite можно кэшировать навсегда
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: всё остальное — index.html (без кэша, чтобы обновления подхватывались сразу)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# Vicinity за nginx хоста (сценарий Б в DEPLOY-VPS.md: на сервере уже есть nginx, например у Telegram-бота).
# Отдельный server только для поддомена Vicinity — сайты Telegram-бота и другие не затрагиваются.
#   1) замени chat.example.com на свой поддомен (его A-запись — на IP VPS);
#   2) в deploy/.env: WEB_BIND=127.0.0.1 и WEB_PORT=8081, затем docker compose up -d;
#   3) sudo cp nginx-vicinity.conf /etc/nginx/sites-available/vicinity
#      sudo ln -s /etc/nginx/sites-available/vicinity /etc/nginx/sites-enabled/vicinity
#      sudo nginx -t && sudo systemctl reload nginx
#   4) sudo certbot --nginx -d chat.example.com — certbot допишет сюда HTTPS (443),
#      сертификат и редирект с http://, а продлевать будет сам.

server {
    listen 80;
    server_name chat.example.com;

    # Аватары и вложения до 15 МБ (+ запас на multipart) — как в контейнере
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;
    }

    # WebSocket: сообщения, присутствие и голос. Соединение живёт часами — длинные таймауты.
    location = /ws {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # В URL лежит токен сессии (?token=) — не пишем его в логи
        access_log off;
    }
}
